services:

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"

  nodered:
    image: nodered/node-red
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data
    depends_on:
      orion:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3002:3000"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./config:/config:ro
    depends_on:
      - influxdb
      - mosquitto

  analytics:
    build: ./analytics
    container_name: analytics
    ports:
      - "5000:5000"
    env_file:
      - ./analytics/.env.docker
    depends_on:
      - influxdb
      - mosquitto

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
    depends_on:
      - influxdb

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  orion:
    image: fiware/orion
    container_name: orion
    ports:
      - "1026:1026"
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /tmp/contextBroker.pid
        exec /usr/bin/contextBroker -fg -multiservice -disableFileLog -dbURI mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  influxdb-data:
  nodered-data:
  grafana-data:
  mongodb-data: