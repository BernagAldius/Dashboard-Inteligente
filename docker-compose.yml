version: '3.9'

services:

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"

  nodered:
    image: nodered/node-red
    container_name: nodered
    ports:
      - "1880:1880"

volumes:
  influxdb-data: